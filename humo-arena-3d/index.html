<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Humo Arena 3D — o'rindiq tanlash</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
  </script>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="labels"></div>

    <header class="brand">
      <div class="logo">H</div>
      <div>
        <div class="brand-name" id="venueName">HUMO ARENA</div>
        <div class="brand-sub" data-i18n="tagline"></div>
      </div>
    </header>

    <button id="backBtn" class="pill back hidden">← <span data-i18n="back"></span></button>
    <div id="hint" class="pill hint" data-i18n="hint"></div>
    <div id="tooltip" class="tooltip hidden"></div>

    <div id="seatCard" class="seat-card hidden">
      <div class="sc-top">
        <span class="sc-view" data-i18n="viewFrom"></span>
        <span class="sc-cat" id="scCat"></span>
      </div>
      <div class="sc-grid">
        <div><small data-i18n="section"></small><b id="scSec"></b></div>
        <div><small data-i18n="row"></small><b id="scRow"></b></div>
        <div><small data-i18n="seat"></small><b id="scSeat"></b></div>
      </div>
      <div class="sc-bottom">
        <div class="sc-price" id="scPrice"></div>
        <button id="scBtn" class="btn primary"></button>
      </div>
    </div>

    <div id="loading" class="loading"><div class="spinner"></div><span data-i18n="loading"></span></div>
  </div>

  <aside id="panel">
    <div class="panel-handle"></div>
    <div class="row-between">
      <label class="lbl" data-i18n="event"></label>
      <div class="langs" id="langs">
        <button data-lang="uz">UZ</button><button data-lang="ru">RU</button><button data-lang="en">EN</button>
      </div>
    </div>
    <select id="eventSel"></select>
    <div id="eventDate" class="muted"></div>

    <h3 data-i18n="categories"></h3>
    <div id="cats"></div>

    <h3 data-i18n="sections"></h3>
    <div id="secList" class="sec-list"></div>

    <div class="cart">
      <h3><span data-i18n="cart"></span> <span id="cartCount" class="badge">0</span></h3>
      <div id="cartItems"></div>
      <div class="row-between total"><span data-i18n="total"></span><b id="cartTotal">0</b></div>
      <button id="checkoutBtn" class="btn primary wide" data-i18n="checkout" disabled></button>
    </div>
  </aside>

  <div id="modal" class="modal hidden">
    <form id="orderForm" class="modal-box">
      <h2 data-i18n="checkout"></h2>
      <div id="orderSummary" class="order-summary"></div>
      <label><span data-i18n="name"></span><input name="name" required autocomplete="name" /></label>
      <label><span data-i18n="phone"></span><input name="phone" required type="tel" placeholder="+998 __ ___ __ __" autocomplete="tel" /></label>
      <div class="row-between gap">
        <button type="button" id="cancelBtn" class="btn" data-i18n="cancel"></button>
        <button type="submit" class="btn primary" data-i18n="pay"></button>
      </div>
    </form>
    <div id="doneBox" class="modal-box hidden">
      <div class="ok">✓</div>
      <h2 data-i18n="orderOk"></h2>
      <p><span data-i18n="orderNo"></span>: <b id="orderNo"></b></p>
      <div id="doneSummary" class="order-summary"></div>
      <button id="doneBtn" class="btn primary wide" data-i18n="close"></button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
